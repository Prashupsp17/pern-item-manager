services:
  postgres:
    image: postgres:16-alpine
    container_name: pern-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pern123456
      POSTGRES_DB: pern_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: pern-backend
    environment:
      PORT: 5000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: pern_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: pern123456
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: pern-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: